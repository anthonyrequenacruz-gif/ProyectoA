<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestro museo ♥</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Figtree:wght@400;600&display=swap">
<style>
:root{--r:#b3122b;--g:#d9a441;--c:#fff6f1;--k:#2a0d14}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--k);color:var(--c);font-family:Figtree,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:600 14px Figtree,sans-serif;cursor:pointer}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 26px;background:linear-gradient(rgba(42,13,20,.85),transparent);pointer-events:none}
.top b{font:400 26px 'Great Vibes',cursive}
.b{pointer-events:auto;border:1px solid var(--g);background:rgba(42,13,20,.8);color:var(--c);border-radius:99px;padding:10px 16px}
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:120px;height:120px;border-radius:50%;border:1px solid var(--g);background:rgba(42,13,20,.45);touch-action:none;z-index:5}
#kn{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b81,var(--r));box-shadow:0 4px 14px #0008;pointer-events:none}
#act{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 48px);max-width:56vw;background:var(--r);border:1px solid var(--g);color:#fff;border-radius:99px;padding:14px 20px;z-index:5;font-size:15px}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(30,6,12,.92);text-align:center;overflow:auto}
.ov[hidden],#act[hidden],#sk[hidden]{display:none}
.in{max-width:30rem;width:100%;display:grid;gap:14px;justify-items:center}
.in h1,.in h2{font:400 clamp(42px,12vw,70px)/1 'Great Vibes',cursive;margin:0;color:#ffd9de}
.in h2{font-size:clamp(34px,9vw,48px)}
.in p{margin:0;font-size:17px;line-height:1.55;white-space:pre-line}
#mi{max-width:100%;max-height:52vh;border:6px solid var(--c);border-radius:4px;box-shadow:0 0 0 2px var(--g),0 20px 50px #000a}
.pr{background:var(--r);color:#fff;border:1px solid var(--g);border-radius:99px;padding:14px 26px;font-size:15px}
#sk{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:6;pointer-events:none}
#fade{position:fixed;inset:0;background:#2a0d14;opacity:0;pointer-events:none;transition:opacity .35s;z-index:15}
#intro{background:radial-gradient(ellipse at 50% 40%,#7a0f22,#2a0d14 75%)}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><b id="fn"></b><button class="b" id="mu" hidden>♪</button></div>
<div id="joy"><div id="kn"></div></div>
<button id="act" hidden></button>
<div id="sk" hidden><button class="b" id="sn"></button><button class="b" id="si">🍦 Helado</button><button class="b" id="su">Levantarnos</button></div>
<div id="fade"></div>
<div class="ov" id="intro"><div class="in"><p style="color:#f4b6c2;letter-spacing:.1em">2 años juntos</p><h1 id="ih"></h1><p>Pasea por nuestro museo, acércate a cada recuerdo y descubre lo que escribí para ti.</p><button class="pr" id="go">Entrar al museo ♥</button></div></div>
<div class="ov" id="modal" hidden><div class="in"><img id="mi" alt=""><h2 id="mt"></h2><p id="mm"></p><button class="pr" id="mx">Volver</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* ===================================================== */
const T=THREE,$=s=>document.querySelector(s),FH=10;
const R=new T.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=T.sRGBEncoding;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,400);sc.background=new T.Color(0x2a0d14);
sc.add(new T.AmbientLight(0xffe6e6,.8),new T.HemisphereLight(0xffffff,0x7a1a28,.55));
const mat=(c,r=.8,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const gold=mat(0xd9a441,.35,.6),red=mat(0xb3122b,.7),cream=mat(0xfbf3ee,.9),dark=mat(0x2b1a1a,.6),green=mat(0x3f7a3a);
const box=(g,w,h,d,m,x,y,z)=>{const b=new T.Mesh(new T.BoxGeometry(w,h,d),m);b.position.set(x,y,z);g.add(b);return b};

const fit=(g,t,w,sz,f)=>{do{g.font=sz+'px '+f;sz-=2}while(g.measureText(t).width>w&&sz>14)};
const floors=[],inter=[[],[],[],[],[],[]],obst=[[],[],[],[],[],[]];let cur=0,modal=false,sitting=false,lying=false,cross=null,holding=false,night=false,ice=false;const vis=new Set([0]);const FM=[0xe53950,0xffd23f,0xffffff,0xff8fb1,0xb86bff,0xff7a1a].map(c=>mat(c));

/* ---------- personajes ---------- */
function mk(o){const g=new T.Group(),M=c=>mat(c),sk=M(o.skin),dk=new T.MeshBasicMaterial({color:0x1b1210});

 const limb=(r,l,m,e,x,y)=>{const a=new T.Group();a.position.set(x,y,0);P(new T.CylinderGeometry(r,r,l,10),m,0,-l/2,0,a);P(new T.SphereGeometry(r*1.2,10,8),e,0,-l,0,a);g.add(a);return a};
 const B=()=>new T.MeshLambertMaterial({color:0x000000}),sh=o.black?B():M(o.shirt),pa=M(o.pants),shoe=o.black?B():M(0x1a1212);

 const h=new T.Group();h.position.y=1.08;g.add(h);P(new T.SphereGeometry(.22,22,16),sk,0,0,0,h);

 if(o.long){P(new T.CylinderGeometry(.235,.2,.64,22,1,true,Math.PI/2,Math.PI),hm,0,-.23,-.01,h);[-1,1].forEach(s=>P(new T.BoxGeometry(.05,.5,.09),hm,s*.205,-.18,.04,h))}if(o.streak){const rm=M(0x8a1022);rm.side=T.DoubleSide;P(new T.CylinderGeometry(.238,.206,.64,22,1,true,Math.PI/2+.5,.7),rm,0,-.23,-.01,h);P(new T.CylinderGeometry(.238,.206,.64,22,1,true,Math.PI*1.2,.5),rm,0,-.23,-.01,h);[-1,1].forEach(s=>P(new T.BoxGeometry(.03,.46,.09),rm,s*.215,-.2,.045,h))}

 const sm=P(new T.TorusGeometry(.04,.012,6,14,Math.PI),new T.MeshBasicMaterial({color:o.lip}),0,-.06,.207,h);sm.rotation.z=Math.PI;

 const c=cv(320,88),x=c.getContext('2d'),t=ctex(c),draw=()=>{x.clearRect(0,0,320,88);x.fillStyle='rgba(42,13,20,.85)';x.fillRect(30,12,260,64);x.strokeStyle='#d9a441';x.strokeRect(30,12,260,64);x.fillStyle='#fff6f1';x.textAlign='center';x.textBaseline='middle';fit(x,o.name,230,38,'Figtree');x.fillText(o.name,160,46);t.needsUpdate=true};draw();
 const tag=new T.Sprite(new T.SpriteMaterial({map:t,transparent:true,depthWrite:false}));tag.scale.set(.8,.22,1);tag.position.y=1.65;g.add(tag);
 g.scale.setScalar(1.2);return{g,lL,lR,aL,aR,h}}
const she=mk({name:CONFIG.she,skin:0xe2ad86,shirt:0,pants:0xe2ad86,hair:0,long:1,black:1,lip:0xc4283a,necklace:1,skirt:1});
const heSit=mk({name:CONFIG.he,skin:0xdba37c,shirt:0xf4f4f6,pants:0x23232b,hair:0x17100d,lip:0x8a3a30});
const heStand=mk({name:CONFIG.he,skin:0xdba37c,shirt:0xf4f4f6,pants:0x23232b,hair:0x17100d,lip:0x8a3a30});
sc.add(she.g);

/* ---------- salas ---------- */
const FLOORTEX=(()=>{const c=cv(128,128),g=c.getContext('2d');for(let i=0;i<2;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#f6dfe0':'#fff7f3';g.fillRect(i*64,j*64,64,64)}const t=ctex(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(5,7);return t})();
function padTex(txt,col){const c=cv(256,256),g=c.getContext('2d');g.fillStyle=col;g.beginPath();g.arc(128,128,124,0,7);g.fill();g.strokeStyle='#d9a441';g.lineWidth=8;g.stroke();heart(g,128,100,48,'#fff');g.fillStyle='#fff';g.textAlign='center';g.font='600 34px Figtree';g.fillText(txt,128,205);return ctex(c)}
function vase(g,x,z){const v=new T.Group();v.position.set(x,0,z);v.add(new T.Mesh(new T.CylinderGeometry(.2,.14,.5,14),cream));v.children[0].position.y=.25;
 for(let i=0;i<9;i++){const a=i*2.4,r=.07+(i%3)*.04,b=new T.Mesh(new T.SphereGeometry(.09,8,6),FM[((i+(x*7|0)+(z*3|0))&7)%FM.length]);b.position.set(Math.cos(a)*r,.62+(i%3)*.07,Math.sin(a)*r);v.add(b)}g.add(v);return v}

 const fr=box(f,w+.3,h+.3,.1,gold,0,0,.05),ph=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:0xf2c4cc}));ph.position.z=.11;f.add(ph);
 const pc=cv(512,96),pg=pc.getContext('2d');pg.fillStyle='#fbf3ee';pg.fillRect(0,0,512,96);pg.strokeStyle='#d9a441';pg.lineWidth=5;pg.strokeRect(4,4,504,88);pg.fillStyle='#8a1426';pg.textAlign='center';pg.textBaseline='middle';
 const fp=()=>{fit(pg,p.cap,470,50,"'Great Vibes'");pg.fillText(p.cap,256,50);pl.material.map.needsUpdate=true};
 const pl=new T.Mesh(new T.PlaneGeometry(1.7,.32),new T.MeshBasicMaterial({map:ctex(pc)}));pl.position.set(0,-(h/2+.4),.08);f.add(pl);fp();document.fonts&&document.fonts.ready.then(()=>{pg.fillStyle='#fbf3ee';pg.fillRect(8,8,496,80);fp()});
 new T.TextureLoader().load(p.src,t=>{t.encoding=T.sRGBEncoding;const a=t.image.width/t.image.height;let pw=w,hh=w/a;if(hh>h){hh=h;pw=h*a}
  ph.scale.set(pw/w,hh/h,1);fr.scale.set((pw+.3)/(w+.3),(hh+.3)/(h+.3),1);ph.material.map=t;ph.material.color.set(0xffffff);ph.material.needsUpdate=true;pl.position.y=-(hh/2+.4)});
 g.add(f);const nx=Math.sin(s[2]),nz=Math.cos(s[2]);
 inter[fi].push({x:s[0]+nx*1.8,z:s[1]+nz*1.8,r:1.5,label:()=>'Ver "'+p.cap+'"',fn:()=>openM(p.src,p.cap,p.msg)})}
const SLOTS=[[[-2.4,-6.9,0],[2.4,-6.9,0],[-4.9,-1.5,Math.PI/2],[4.9,-1.5,-Math.PI/2]],[[-4.9,-3.2,Math.PI/2],[4.9,-3.2,-Math.PI/2],[-4.9,2.6,Math.PI/2]],[[0,-6.9,0],[-4.9,-1.5,Math.PI/2]]];
function room(i){const g=new T.Group();g.position.y=i*FH;g.visible=false;sc.add(g);floors.push(g);
 const fl=new T.Mesh(new T.PlaneGeometry(10,14),new T.MeshStandardMaterial({map:FLOORTEX,roughness:.4}));fl.rotation.x=-Math.PI/2;g.add(fl);
 const rg=new T.Mesh(new T.PlaneGeometry(2.4,14),mat(0x9c0f26,1));rg.rotation.x=-Math.PI/2;rg.position.y=.01;g.add(rg);
 [-1.1,1.1].forEach(x=>{const s=new T.Mesh(new T.PlaneGeometry(.1,14),gold);s.rotation.x=-Math.PI/2;s.position.set(x,.02,0);g.add(s)});
 box(g,10,4.5,.2,cream,0,2.25,-7.1);box(g,10,4.5,.2,cream,0,2.25,7.1);box(g,.2,4.5,14,cream,-5.1,2.25,0);box(g,.2,4.5,14,cream,5.1,2.25,0);
 box(g,10,1.1,.1,red,0,.55,-6.98);box(g,10,1.1,.1,red,0,.55,6.98);box(g,.1,1.1,14,red,-4.98,.55,0);box(g,.1,1.1,14,red,4.98,.55,0);
 box(g,10,.07,.14,gold,0,1.12,-6.95);box(g,10,.07,.14,gold,0,1.12,6.95);box(g,.14,.07,14,gold,-4.95,1.12,0);box(g,.14,.07,14,gold,4.95,1.12,0);
 if(i<2){const c=new T.Mesh(new T.PlaneGeometry(10,14),cream);c.rotation.x=Math.PI/2;c.position.y=4.5;g.add(c)}
 [[0,3.9,0],[0,3.9,-4.5],[0,3.9,4.5]].forEach(p=>{const l=new T.PointLight(0xffd9d0,.8,13);l.position.set(...p);g.add(l)});
 [[-4.3,-6.3],[4.3,-6.3],[-4.3,6.3],[4.3,6.3]].forEach(p=>{if(!((i==1||i==4)&&p[1]<0))vase(g,p[0],p[1]);obst[i].push([p[0],p[1],.35])});

  inter[i].push({x,z,r:1.2,label:()=>to==5?'Salir al patio ♥':(to>i?'Subir a ':'Bajar a ')+NM[to],fn:()=>tryGo(to)})};
 const PD={0:[[3.5,5.5,1]],1:[[3.5,5.5,2],[-3.5,5.5,0]],2:[[3.5,5.5,3],[3.6,2.4,4],[-3.6,2.4,5],[-3.5,5.5,1]],3:[[-3.5,5.5,2]],4:[[-3.5,5.5,2]],5:[[-3.5,5.5,2]]};PD[i].forEach(([x,z,to])=>{mp(x,z,to>i?'SUBIR':'BAJAR',to>i?'#b3122b':'#e58a98',to);stairs(g,x,z,to>i)});
 return g}
[0,1,2,3,4,5].forEach(room);

/* piso 2: cine */
(function(){const g=floors[1];
 box(g,4.3,2.5,.2,dark,0,2.4,-6.8);box(g,4.6,.7,.7,mat(0x4a2418),0,.35,-6.5);

 const tc=cv(960,520),tg=tc.getContext('2d'),tt=ctex(tc);const scr=new T.Mesh(new T.PlaneGeometry(4,2.2),new T.MeshBasicMaterial({map:tt}));scr.position.set(0,2.4,-6.68);g.add(scr);
 let key='';window.drawTV=(txt,sub,k)=>{if(k===key)return;key=k;tg.fillStyle='#14040a';tg.fillRect(0,0,960,520);const gr=tg.createRadialGradient(480,260,20,480,260,520);gr.addColorStop(0,'#7a0f22');gr.addColorStop(1,'#14040a');tg.fillStyle=gr;tg.fillRect(0,50,960,420);

  heart(tg,480,370,28,'#ff4d6a');tg.font='600 28px Figtree';tg.fillStyle='#ffd9de';tg.fillText(sub||'',480,440);tt.needsUpdate=true};
 document.fonts&&document.fonts.ready.then(()=>{key='';});
 const sf=new T.Group();sf.position.set(0,0,1.2);box(sf,3.2,.5,1.2,red,0,.25,0);box(sf,3.2,1,.3,red,0,.85,.55);[-1.7,1.7].forEach(x=>box(sf,.25,.8,1.2,red,x,.4,0));
 [-.75,.75].forEach(x=>box(sf,1.4,.15,.9,mat(0xe8586f),x,.57,-.05));g.add(sf);
 [-1.1,0,1.1].forEach(x=>obst[1].push([x,1.3,.75]));obst[1].push([0,-6.5,1.2]);
 heSit.g.position.set(.7,.28,1.15);heSit.g.rotation.y=Math.PI;heSit.lL.rotation.x=heSit.lR.rotation.x=-1.4;g.add(heSit.g);
 const pc=new T.Group();pc.position.set(2.6,0,-1);pc.add(new T.Mesh(new T.CylinderGeometry(.22,.16,.3,14),mat(0xffffff)));pc.children[0].position.y=.15;for(let i=0;i<8;i++){const b=new T.Mesh(new T.SphereGeometry(.07,6,5),mat(0xfff0b8));b.position.set(Math.cos(i*2.4)*.1,.34+(i%3)*.03,Math.sin(i*2.4)*.1);pc.add(b)}g.add(pc);
 inter[1].push({x:0,z:3.1,r:1.4,label:()=>sitting?'Levantarnos':'Sentarnos a ver la peli',fn:()=>sitting?stand():sit()})})();

/* piso 3: jardín nocturno */
(function(){const g=floors[2];
 const bm=[mat(0xd81b60),mat(0xff4f8b),mat(0xc2185b)],ge=new T.IcosahedronGeometry(.16,0);
 for(let k=0;k<150;k++){const m=new T.Mesh(ge,bm[k%3]),w=k%3;let x,y=3.5+Math.random()*1.2,z;
  if(w==0){x=(Math.random()-.5)*10;z=-6.8+Math.random()*.5}else if(w==1){x=-4.7+Math.random()*.4;z=(Math.random()-.5)*13}else{x=4.7-Math.random()*.4;z=(Math.random()-.5)*13}
  m.position.set(x,y,z);m.scale.setScalar(.6+Math.random()*1.2);g.add(m)}
