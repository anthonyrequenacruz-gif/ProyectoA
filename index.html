<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestro museo ♥</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Figtree:wght@400;600&display=swap">
<style>
:root{--r:#b3122b;--g:#d9a441;--c:#fff6f1;--k:#2a0d14}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--k);color:var(--c);font-family:Figtree,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:600 14px Figtree,sans-serif;cursor:pointer}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 26px;background:linear-gradient(rgba(42,13,20,.85),transparent);pointer-events:none}
.top b{font:400 26px 'Great Vibes',cursive}
.b{pointer-events:auto;border:1px solid var(--g);background:rgba(42,13,20,.8);color:var(--c);border-radius:99px;padding:10px 16px}
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:120px;height:120px;border-radius:50%;border:1px solid var(--g);background:rgba(42,13,20,.45);touch-action:none;z-index:5}
#kn{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b81,var(--r));box-shadow:0 4px 14px #0008;pointer-events:none}
#act{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 48px);max-width:56vw;background:var(--r);border:1px solid var(--g);color:#fff;border-radius:99px;padding:14px 20px;z-index:5;font-size:15px}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(30,6,12,.92);text-align:center;overflow:auto}
.ov[hidden],#act[hidden]{display:none}
.in{max-width:30rem;width:100%;display:grid;gap:14px;justify-items:center}
.in h1,.in h2{font:400 clamp(42px,12vw,70px)/1 'Great Vibes',cursive;margin:0;color:#ffd9de}
.in h2{font-size:clamp(34px,9vw,48px)}
.in p{margin:0;font-size:17px;line-height:1.55;white-space:pre-line}
#mi{max-width:100%;max-height:52vh;border:6px solid var(--c);border-radius:4px;box-shadow:0 0 0 2px var(--g),0 20px 50px #000a}
.pr{background:var(--r);color:#fff;border:1px solid var(--g);border-radius:99px;padding:14px 26px;font-size:15px}
#fade{position:fixed;inset:0;background:#2a0d14;opacity:0;pointer-events:none;transition:opacity .35s;z-index:15}
#intro{background:radial-gradient(ellipse at 50% 40%,#7a0f22,#2a0d14 75%)}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><b id="fn"></b><button class="b" id="mu" hidden>♪</button></div>
<div id="joy"><div id="kn"></div></div>
<button id="act" hidden></button>
<div id="fade"></div>
<div class="ov" id="intro"><div class="in"><p style="color:#f4b6c2;letter-spacing:.1em">2 años juntos</p><h1 id="ih"></h1><p>Pasea por nuestro museo, acércate a cada recuerdo y descubre lo que escribí para ti.</p><button class="pr" id="go">Entrar al museo ♥</button></div></div>
<div class="ov" id="modal" hidden><div class="in"><img id="mi" alt=""><h2 id="mt"></h2><p id="mm"></p><button class="pr" id="mx">Volver</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ EDITA AQUÍ: textos y fotos ============ */
const CONFIG={
 she:'María', he:'Anthony',
 music:'musica/cancion.mp3',
 floors:[
  {name:'Piso 1 · Cómo empezó todo',photos:[
   {src:'fotos/foto6.jpg',cap:'Recuerdo 1',msg:'Aquí va tu mensaje para esta foto.'},
   {src:'fotos/foto4.jpg',cap:'Recuerdo 2',msg:'Aquí va tu mensaje para esta foto.'},
   {src:'fotos/foto7.jpg',cap:'Recuerdo 3',msg:'Aquí va tu mensaje para esta foto.'},
   {src:'fotos/foto8.jpg',cap:'Recuerdo 4',msg:'Aquí va tu mensaje para esta foto.'}]},
  {name:'Piso 2 · Sala de cine',photos:[
   {src:'fotos/foto1.jpg',cap:'Recuerdo 5',msg:'Aquí va tu mensaje para esta foto.'},
   {src:'fotos/foto3.jpg',cap:'Recuerdo 6',msg:'Aquí va tu mensaje para esta foto.'},
   {src:'fotos/foto2.jpg',cap:'Recuerdo 7',msg:'Aquí va tu mensaje para esta foto.'}]},
  {name:'Piso 3 · Jardín de flores',photos:[
   {src:'fotos/foto5.jpg',cap:'Recuerdo 8',msg:'Aquí va tu mensaje para esta foto.'},
   {src:'fotos/foto9.jpg',cap:'Nosotros, versión anime',msg:'Aquí va tu mensaje para esta foto.'}]}],
 movie:['Por más pelis juntos','Por más abrazos en el sillón','Por más aventuras de la mano','Feliz aniversario, mi amor'],
 letterTitle:'Para ti, María',
 letter:'Aquí va tu carta final.\n\nFeliz aniversario, mi amor.',
 letterSign:'— Anthony'
};
/* ===================================================== */
const T=THREE,$=s=>document.querySelector(s),FH=10;
const R=new T.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=T.sRGBEncoding;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,90);sc.background=new T.Color(0x2a0d14);
sc.add(new T.AmbientLight(0xffe6e6,.8),new T.HemisphereLight(0xffffff,0x7a1a28,.55));
const mat=(c,r=.8,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const gold=mat(0xd9a441,.35,.6),red=mat(0xb3122b,.7),cream=mat(0xfbf3ee,.9),dark=mat(0x2b1a1a,.6),green=mat(0x3f7a3a);
const box=(g,w,h,d,m,x,y,z)=>{const b=new T.Mesh(new T.BoxGeometry(w,h,d),m);b.position.set(x,y,z);g.add(b);return b};
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const ctex=c=>{const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t};
function heart(g,x,y,s,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y+s);g.bezierCurveTo(x-1.3*s,y-.1*s,x-.6*s,y-s,x,y-.4*s);g.bezierCurveTo(x+.6*s,y-s,x+1.3*s,y-.1*s,x,y+s);g.fill()}
const fit=(g,t,w,sz,f)=>{do{g.font=sz+'px '+f;sz-=2}while(g.measureText(t).width>w&&sz>14)};
const floors=[],inter=[[],[],[]],obst=[[],[],[]];let cur=0,modal=false,sitting=false;

/* ---------- personajes ---------- */
function mk(o){const g=new T.Group(),M=c=>mat(c),sk=M(o.skin),dk=new T.MeshBasicMaterial({color:0x1b1210});
 const P=(geo,m,x,y,z,p)=>{const q=new T.Mesh(geo,m);q.position.set(x,y,z);(p||g).add(q);return q};
 const limb=(r,l,m,e,x,y)=>{const a=new T.Group();a.position.set(x,y,0);P(new T.CylinderGeometry(r,r,l,10),m,0,-l/2,0,a);P(new T.SphereGeometry(r*1.2,10,8),e,0,-l,0,a);g.add(a);return a};
 const sh=M(o.shirt),pa=M(o.pants),shoe=M(0x1a1212);
 const lL=limb(.07,.34,pa,shoe,-.1,.4),lR=limb(.07,.34,pa,shoe,.1,.4);
 P(new T.CylinderGeometry(.17,.2,.4,18),sh,0,.6,0);P(new T.SphereGeometry(.17,16,10),sh,0,.8,0).scale.y=.5;
 if(o.skirt)P(new T.CylinderGeometry(.2,.31,.24,18),pa,0,.42,0);
 const aL=limb(.05,.3,sh,sk,-.23,.78),aR=limb(.05,.3,sh,sk,.23,.78);
 const h=new T.Group();h.position.y=1.08;g.add(h);P(new T.SphereGeometry(.22,22,16),sk,0,0,0,h);
 const hm=M(o.hair);hm.side=T.DoubleSide;
 P(new T.SphereGeometry(.235,22,14,0,6.283,0,1.75),hm,0,.02,-.015,h).rotation.x=-.25;
 if(o.long){P(new T.CylinderGeometry(.235,.2,.64,22,1,true,Math.PI/2,Math.PI),hm,0,-.23,-.01,h);[-1,1].forEach(s=>P(new T.BoxGeometry(.05,.5,.09),hm,s*.205,-.18,.04,h))}
 [-1,1].forEach(s=>{P(new T.SphereGeometry(.024,10,8),dk,s*.075,.03,.2,h);
  const r=P(new T.TorusGeometry(.058,.009,6,20),dk,s*.083,.03,.208,h);
  P(new T.SphereGeometry(.03,10,8),M(0xf08a8a),s*.125,-.05,.17,h).scale.z=.35});
 P(new T.BoxGeometry(.05,.01,.01),dk,0,.04,.215,h);
 const sm=P(new T.TorusGeometry(.04,.012,6,14,Math.PI),new T.MeshBasicMaterial({color:o.lip}),0,-.06,.207,h);sm.rotation.z=Math.PI;
 if(o.necklace)P(new T.TorusGeometry(.115,.006,6,20),gold,0,.86,.05).rotation.x=1.35;
 const c=cv(320,88),x=c.getContext('2d'),t=ctex(c),draw=()=>{x.clearRect(0,0,320,88);x.fillStyle='rgba(42,13,20,.85)';x.fillRect(30,12,260,64);x.strokeStyle='#d9a441';x.strokeRect(30,12,260,64);x.fillStyle='#fff6f1';x.textAlign='center';x.textBaseline='middle';fit(x,o.name,230,38,'Figtree');x.fillText(o.name,160,46);t.needsUpdate=true};draw();
 const tag=new T.Sprite(new T.SpriteMaterial({map:t,transparent:true,depthWrite:false}));tag.scale.set(.8,.22,1);tag.position.y=1.65;g.add(tag);
 g.scale.setScalar(1.2);return{g,lL,lR,aL,aR,h}}
const she=mk({name:CONFIG.she,skin:0xe2ad86,shirt:0x1b1b22,pants:0x1b1b22,hair:0x1d120e,long:1,lip:0xc4283a,necklace:1,skirt:1});
const heSit=mk({name:CONFIG.he,skin:0xdba37c,shirt:0xf4f4f6,pants:0x23232b,hair:0x17100d,lip:0x8a3a30});
const heStand=mk({name:CONFIG.he,skin:0xdba37c,shirt:0xf4f4f6,pants:0x23232b,hair:0x17100d,lip:0x8a3a30});
sc.add(she.g);

/* ---------- salas ---------- */
const FLOORTEX=(()=>{const c=cv(128,128),g=c.getContext('2d');for(let i=0;i<2;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#f6dfe0':'#fff7f3';g.fillRect(i*64,j*64,64,64)}const t=ctex(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(5,7);return t})();
function padTex(txt,col){const c=cv(256,256),g=c.getContext('2d');g.fillStyle=col;g.beginPath();g.arc(128,128,124,0,7);g.fill();g.strokeStyle='#d9a441';g.lineWidth=8;g.stroke();heart(g,128,100,48,'#fff');g.fillStyle='#fff';g.textAlign='center';g.font='600 34px Figtree';g.fillText(txt,128,205);return ctex(c)}
function vase(g,x,z){const v=new T.Group();v.position.set(x,0,z);v.add(new T.Mesh(new T.CylinderGeometry(.2,.14,.5,14),cream));v.children[0].position.y=.25;
 for(let i=0;i<9;i++){const a=i*2.4,r=.07+(i%3)*.04,b=new T.Mesh(new T.SphereGeometry(.09,8,6),red);b.position.set(Math.cos(a)*r,.62+(i%3)*.07,Math.sin(a)*r);v.add(b)}g.add(v);return v}
function frame(g,fi,p,s,big){const w=big?3:2.2,h=big?2.2:1.7,f=new T.Group();f.position.set(s[0],2.4,s[1]);f.rotation.y=s[2];
 const fr=box(f,w+.3,h+.3,.1,gold,0,0,.05),ph=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:0xf2c4cc}));ph.position.z=.11;f.add(ph);
 const pc=cv(512,96),pg=pc.getContext('2d');pg.fillStyle='#fbf3ee';pg.fillRect(0,0,512,96);pg.strokeStyle='#d9a441';pg.lineWidth=5;pg.strokeRect(4,4,504,88);pg.fillStyle='#8a1426';pg.textAlign='center';pg.textBaseline='middle';
 const fp=()=>{fit(pg,p.cap,470,50,"'Great Vibes'");pg.fillText(p.cap,256,50);pl.material.map.needsUpdate=true};
 const pl=new T.Mesh(new T.PlaneGeometry(1.7,.32),new T.MeshBasicMaterial({map:ctex(pc)}));pl.position.set(0,-(h/2+.4),.08);f.add(pl);fp();document.fonts&&document.fonts.ready.then(()=>{pg.fillStyle='#fbf3ee';pg.fillRect(8,8,496,80);fp()});
 new T.TextureLoader().load(p.src,t=>{t.encoding=T.sRGBEncoding;const a=t.image.width/t.image.height;let pw=w,hh=w/a;if(hh>h){hh=h;pw=h*a}
  ph.scale.set(pw/w,hh/h,1);fr.scale.set((pw+.3)/(w+.3),(hh+.3)/(h+.3),1);ph.material.map=t;ph.material.color.set(0xffffff);ph.material.needsUpdate=true;pl.position.y=-(hh/2+.4)});
 g.add(f);const nx=Math.sin(s[2]),nz=Math.cos(s[2]);
 inter[fi].push({x:s[0]+nx*1.8,z:s[1]+nz*1.8,r:1.5,label:()=>'Ver "'+p.cap+'"',fn:()=>openM(p.src,p.cap,p.msg)})}
const SLOTS=[[[-2.4,-6.9,0],[2.4,-6.9,0],[-4.9,-1.5,Math.PI/2],[4.9,-1.5,-Math.PI/2]],[[-4.9,-3.2,Math.PI/2],[4.9,-3.2,-Math.PI/2],[-4.9,2.6,Math.PI/2]],[[0,-6.9,0],[-4.9,-1.5,Math.PI/2]]];
function room(i){const g=new T.Group();g.position.y=i*FH;g.visible=false;sc.add(g);floors.push(g);
 const fl=new T.Mesh(new T.PlaneGeometry(10,14),new T.MeshStandardMaterial({map:FLOORTEX,roughness:.4}));fl.rotation.x=-Math.PI/2;g.add(fl);
 const rg=new T.Mesh(new T.PlaneGeometry(2.4,14),mat(0x9c0f26,1));rg.rotation.x=-Math.PI/2;rg.position.y=.01;g.add(rg);
 [-1.1,1.1].forEach(x=>{const s=new T.Mesh(new T.PlaneGeometry(.1,14),gold);s.rotation.x=-Math.PI/2;s.position.set(x,.02,0);g.add(s)});
 box(g,10,4.5,.2,cream,0,2.25,-7.1);box(g,10,4.5,.2,cream,0,2.25,7.1);box(g,.2,4.5,14,cream,-5.1,2.25,0);box(g,.2,4.5,14,cream,5.1,2.25,0);
 box(g,10,1.1,.1,red,0,.55,-6.98);box(g,10,1.1,.1,red,0,.55,6.98);box(g,.1,1.1,14,red,-4.98,.55,0);box(g,.1,1.1,14,red,4.98,.55,0);
 box(g,10,.07,.14,gold,0,1.12,-6.95);box(g,10,.07,.14,gold,0,1.12,6.95);box(g,.14,.07,14,gold,-4.95,1.12,0);box(g,.14,.07,14,gold,4.95,1.12,0);
 if(i<2){const c=new T.Mesh(new T.PlaneGeometry(10,14),cream);c.rotation.x=Math.PI/2;c.position.y=4.5;g.add(c)}
 [[0,3.9,0],[0,3.9,-4.5],[0,3.9,4.5]].forEach(p=>{const l=new T.PointLight(0xffd9d0,.8,13);l.position.set(...p);g.add(l)});
 [[-4.3,-6.3],[4.3,-6.3],[-4.3,6.3],[4.3,6.3]].forEach(p=>{if(!(i==1&&p[1]<0))vase(g,p[0],p[1]);obst[i].push([p[0],p[1],.35])});
 SLOTS[i].forEach((s,k)=>frame(g,i,CONFIG.floors[i].photos[k],s,i==2&&k==0));
 const mp=(x,z,txt,col,to)=>{const p=new T.Mesh(new T.CircleGeometry(.9,32),new T.MeshBasicMaterial({map:padTex(txt,col)}));p.rotation.x=-Math.PI/2;p.position.set(x,.03,z);g.add(p);
  inter[i].push({x,z,r:1.2,label:()=>txt==='SUBIR'?'Subir al piso '+(i+2)+' ♥':'Bajar al piso '+i,fn:()=>go(to)})};
 if(i<2)mp(3.5,5.5,'SUBIR','#b3122b',i+1);if(i>0)mp(-3.5,5.5,'BAJAR','#e58a98',i-1);
 return g}
[0,1,2].forEach(room);

/* piso 2: cine */
(function(){const g=floors[1];
 box(g,4.3,2.5,.2,dark,0,2.4,-6.8);box(g,4.6,.7,.7,mat(0x4a2418),0,.35,-6.5);
 [-1,1].forEach(s=>{box(g,.7,4.4,.3,red,s*2.9,2.2,-6.75);box(g,.7,.15,.4,gold,s*2.9,4.4,-6.75)});
 const tc=cv(960,520),tg=tc.getContext('2d'),tt=ctex(tc);const scr=new T.Mesh(new T.PlaneGeometry(4,2.2),new T.MeshBasicMaterial({map:tt}));scr.position.set(0,2.4,-6.68);g.add(scr);
 let key='';window.drawTV=(txt,sub,k)=>{if(k===key)return;key=k;tg.fillStyle='#14040a';tg.fillRect(0,0,960,520);const gr=tg.createRadialGradient(480,260,20,480,260,520);gr.addColorStop(0,'#7a0f22');gr.addColorStop(1,'#14040a');tg.fillStyle=gr;tg.fillRect(0,50,960,420);
  tg.fillStyle='#000';tg.fillRect(0,0,960,50);tg.fillRect(0,470,960,50);tg.textAlign='center';tg.textBaseline='middle';tg.fillStyle='#fff6f1';fit(tg,txt,860,96,"'Great Vibes'");tg.fillText(txt,480,250);
  heart(tg,480,370,28,'#ff4d6a');tg.font='600 28px Figtree';tg.fillStyle='#ffd9de';tg.fillText(sub||'',480,440);tt.needsUpdate=true};
 document.fonts&&document.fonts.ready.then(()=>{key='';});
 const sf=new T.Group();sf.position.set(0,0,1.2);box(sf,3.2,.5,1.2,red,0,.25,0);box(sf,3.2,1,.3,red,0,.85,.55);[-1.7,1.7].forEach(x=>box(sf,.25,.8,1.2,red,x,.4,0));
 [-.75,.75].forEach(x=>box(sf,1.4,.15,.9,mat(0xe8586f),x,.57,-.05));g.add(sf);
 [-1.1,0,1.1].forEach(x=>obst[1].push([x,1.3,.75]));obst[1].push([0,-6.5,1.2]);
 heSit.g.position.set(.7,.28,1.15);heSit.g.rotation.y=Math.PI;heSit.lL.rotation.x=heSit.lR.rotation.x=-1.4;g.add(heSit.g);
 const pc=new T.Group();pc.position.set(2.6,0,-1);pc.add(new T.Mesh(new T.CylinderGeometry(.22,.16,.3,14),mat(0xffffff)));pc.children[0].position.y=.15;for(let i=0;i<8;i++){const b=new T.Mesh(new T.SphereGeometry(.07,6,5),mat(0xfff0b8));b.position.set(Math.cos(i*2.4)*.1,.34+(i%3)*.03,Math.sin(i*2.4)*.1);pc.add(b)}g.add(pc);
 inter[1].push({x:0,z:3.1,r:1.4,label:()=>sitting?'Levantarnos':'Sentarnos a ver la peli',fn:()=>sitting?stand():sit()})})();

/* piso 3: jardín nocturno */
(function(){const g=floors[2];
 const bm=[mat(0xd81b60),mat(0xff4f8b),mat(0xc2185b)],ge=new T.IcosahedronGeometry(.16,0);
 for(let k=0;k<150;k++){const m=new T.Mesh(ge,bm[k%3]),w=k%3;let x,y=3.5+Math.random()*1.2,z;
  if(w==0){x=(Math.random()-.5)*10;z=-6.8+Math.random()*.5}else if(w==1){x=-4.7+Math.random()*.4;z=(Math.random()-.5)*13}else{x=4.7-Math.random()*.4;z=(Math.random()-.5)*13}
  m.position.set(x,y,z);m.scale.setScalar(.6+Math.random()*1.2);g.add(m)}
 const bulb=new T.MeshBasicMaterial({color:0xffe2a8});
 [-4,0,4].forEach(z=>{for(let k=0;k<=14;k++){const t=k/14,b=new T.Mesh(new T.SphereGeometry(.05,6,5),bulb);b.position.set(-4.9+t*9.8,4.3-Math.sin(Math.PI*t)*.45,z);g.add(b)}});
 const sp=new T.Mesh(new T.CylinderGeometry(.45,.55,1,24),cream);sp.position.set(0,.5,-2);g.add(sp);box(g,1.3,.08,1.3,gold,0,1.04,-2).scale.set(.8,1,.8);
 const hc=cv(128,128);heart(hc.getContext('2d'),64,60,40,'#ff2a4d');const hs=new T.Sprite(new T.SpriteMaterial({map:ctex(hc),transparent:true}));hs.scale.set(.9,.9,1);hs.position.set(0,1.7,-2);g.add(hs);window.hs=hs;
 obst[2].push([0,-2,.7]);inter[2].push({x:0,z:-.6,r:1.5,label:()=>'Abrir mi carta ♥',fn:()=>openM('',CONFIG.letterTitle,CONFIG.letter+'\n\n'+CONFIG.letterSign)});
 heStand.g.position.set(1.8,0,-1.4);heStand.g.rotation.y=-.5;g.add(heStand.g);
 const bq=new T.Group();bq.position.set(-.3,.78,.3);for(let i=0;i<12;i++){const b=new T.Mesh(new T.SphereGeometry(.08,8,6),i%4?red:mat(0xffffff));b.position.set(Math.cos(i*2.4)*.1,Math.sin(i*1.3)*.05+.1,Math.sin(i*2.4)*.1);bq.add(b)}
 const st=new T.Mesh(new T.CylinderGeometry(.02,.02,.3,6),green);st.position.y=-.08;bq.add(st);heStand.g.add(bq);bq.scale.setScalar(1.3)
 const sg=new Float32Array(900);for(let i=0;i<300;i++){sg[i*3]=(Math.random()-.5)*60;sg[i*3+1]=6+Math.random()*25;sg[i*3+2]=(Math.random()-.5)*60}
 const gm=new T.BufferGeometry();gm.setAttribute('position',new T.BufferAttribute(sg,3));g.add(new T.Points(gm,new T.PointsMaterial({size:.25,color:0xffffff})))})();

/* corazones que suben */
const HN=70,hp=new Float32Array(HN*3),hg=new T.BufferGeometry();
for(let i=0;i<HN;i++){hp[i*3]=(Math.random()-.5)*9;hp[i*3+1]=Math.random()*4.3;hp[i*3+2]=(Math.random()-.5)*13}
hg.setAttribute('position',new T.BufferAttribute(hp,3));
const hc2=cv(64,64);heart(hc2.getContext('2d'),32,30,20,'#ff7b92');
const hpts=new T.Points(hg,new T.PointsMaterial({size:.22,map:ctex(hc2),transparent:true,opacity:.8,depthWrite:false}));sc.add(hpts);

/* ---------- control ---------- */
const hero=she,pos={x:0,z:5},K={u:0,d:0,l:0,r:0},joy={x:0,y:0};let yaw=0,camYaw=0,cyaw=0,phase=0,tvT=0,started=false,lastT=performance.now();
function openM(src,t,m){$('#mi').style.display=src?'block':'none';if(src)$('#mi').src=src;$('#mt').textContent=t;$('#mm').textContent=m;$('#modal').hidden=false;modal=true}
$('#mx').onclick=()=>{$('#modal').hidden=true;modal=false};
function show(){floors.forEach((f,i)=>f.visible=i===cur);sc.background.set(cur==2?0x0a0f2e:0x2a0d14);$('#fn').textContent=CONFIG.floors[cur].name}
function go(n){$('#fade').style.opacity=1;setTimeout(()=>{if(sitting)stand();const up=n>cur;cur=n;pos.x=up?-3.5:3.5;pos.z=4.1;show();setTimeout(()=>$('#fade').style.opacity=0,80)},360)}
function sit(){sitting=true;pos.x=-.7;pos.z=1.15;yaw=Math.PI;tvT=0}
function stand(){sitting=false;pos.x=-.7;pos.z=3.3}
show();
const joyEl=$('#joy');let jid=null;
const jm=e=>{const r=joyEl.getBoundingClientRect(),R2=r.width/2-12;let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const l=Math.hypot(dx,dy);if(l>R2){dx*=R2/l;dy*=R2/l}$('#kn').style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/R2;joy.y=-dy/R2};
joyEl.onpointerdown=e=>{jid=e.pointerId;joyEl.setPointerCapture(jid);jm(e)};joyEl.onpointermove=e=>{if(e.pointerId===jid)jm(e)};
joyEl.onpointerup=joyEl.onpointercancel=()=>{jid=null;joy.x=joy.y=0;$('#kn').style.transform=''};
const KM={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{if(KM[e.code]){K[KM[e.code]]=1;e.preventDefault()}if((e.code==='Enter'||e.code==='Space')&&!modal&&near){near.fn();e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.code])K[KM[e.code]]=0});
let dr=null;const cvEl=$('#c');cvEl.onpointerdown=e=>{dr={x:e.clientX,y:camYaw};cvEl.setPointerCapture(e.pointerId)};cvEl.onpointermove=e=>{if(dr)camYaw=dr.y-(e.clientX-dr.x)*.006};cvEl.onpointerup=()=>dr=null;
let near=null;$('#act').onclick=()=>{if(near&&!modal)near.fn()};
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

const aud=new Audio(CONFIG.music);aud.loop=true;aud.volume=.6;aud.onerror=()=>$('#mu').hidden=true;aud.oncanplay=()=>$('#mu').hidden=false;
$('#mu').onclick=()=>{aud.paused?aud.play():aud.pause()};
$('#ih').textContent='Feliz aniversario, '+CONFIG.she;
$('#go').onclick=()=>{$('#intro').hidden=true;started=true;aud.play().catch(()=>{})};

function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const t=now/1000;
 let jx=joy.x+K.r-K.l,jy=joy.y+K.u-K.d;const m=Math.hypot(jx,jy);let mv=false;
 if(started&&!modal&&m>.12){if(sitting)stand();const n=Math.min(1,m);jx/=m;jy/=m;
  const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
  const dx=fx*jy+rx*jx,dz=fz*jy+rz*jx;let nx=pos.x+dx*3.3*n*dt,nz=pos.z+dz*3.3*n*dt;
  nx=Math.max(-4.5,Math.min(4.5,nx));nz=Math.max(-6.4,Math.min(6.4,nz));
  obst[cur].forEach(o=>{const ex=nx-o[0],ez=nz-o[1],d=Math.hypot(ex,ez),rr=o[2]+.3;if(d<rr){nx=o[0]+ex/(d||1)*rr;nz=o[1]+ez/(d||1)*rr}});
  pos.x=nx;pos.z=nz;yaw=Math.atan2(dx,dz);mv=true;phase+=dt*9}
 const g=hero.g;g.position.set(pos.x,cur*FH+(sitting?.28:0),pos.z);let d=yaw-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*Math.min(1,dt*10);
 const sw=mv?Math.sin(phase)*.7:0;
 if(sitting){hero.lL.rotation.x=hero.lR.rotation.x=-1.4;hero.aL.rotation.x=hero.aR.rotation.x=0}else{hero.lL.rotation.x=sw;hero.lR.rotation.x=-sw;hero.aL.rotation.x=-sw*.8;hero.aR.rotation.x=sw*.8}
 heStand.aL.rotation.z=-2.4-Math.sin(t*7)*.3;heStand.g.position.y=0;heSit.h.rotation.y=sitting?-.35:0;
 if(window.hs)hs.position.y=1.75+Math.sin(t*2)*.08;
 /* tele */
 if(cur==1){if(sitting){tvT+=dt;const L=CONFIG.movie,i=Math.floor(tvT/3.6)%L.length;drawTV(L[i],CONFIG.she+' & '+CONFIG.he,'p'+i)}else drawTV('Nuestra película','Siéntate en el sillón para empezar ▶','idle')}
 /* cámara */
 if(sitting)camYaw+=Math.atan2(Math.sin(-camYaw),Math.cos(-camYaw))*Math.min(1,dt*2);
 const D=sitting?3.6:5.2,ty=cur*FH+1.1;
 const tx=Math.max(-4.7,Math.min(4.7,pos.x+Math.sin(camYaw)*D)),tz=Math.max(-6.7,Math.min(6.7,pos.z+Math.cos(camYaw)*D));
 cam.position.lerp(new T.Vector3(tx,ty+1.5,tz),Math.min(1,dt*6));cam.lookAt(pos.x,ty,pos.z);
 /* corazones */
 const P=hg.attributes.position.array;for(let i=0;i<HN;i++){P[i*3+1]+=dt*.3;if(P[i*3+1]>4.3)P[i*3+1]=0}
 hpts.position.y=cur*FH;hg.attributes.position.needsUpdate=true;
 /* interacción */
 near=null;if(started&&!modal){let b=1e9;inter[cur].forEach(o=>{const d2=Math.hypot(pos.x-o.x,pos.z-o.z);if(d2<o.r&&d2<b){b=d2;near=o}})}
 const a=$('#act');if(near){a.hidden=false;const l=near.label();if(a.textContent!==l)a.textContent=l}else a.hidden=true;
 R.render(sc,cam)}
requestAnimationFrame(tick);
</script></body></html>
